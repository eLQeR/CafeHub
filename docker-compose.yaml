services:
  api:
    image: elqer/cafehub-backend:1.4
    container_name: backend_cafe
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py wait_for_db &&
            python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db

  db:
    image: postgres:16.0-alpine3.18
    restart: always
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - ./data/db:$PG_DATA

  redis:
    image: "redis:alpine"

  celery:
    image: elqer/cafehub-backend:1.4
    command: celery -A Cafe_system worker -l INFO
    depends_on:
      - db
      - redis
      - api
    restart: on-failure
    env_file:
      - .env


  frontend:
    depends_on:
      - api
    image: elqer/cafehub-frontend:1.4
    ports:
      - '3000:3000'
    container_name: frontend_cafe
    restart: unless-stopped
  nginx:
    depends_on:
      - frontend
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - '80:80'
      - '443:443'
    container_name: nginx
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot --force-renewal --email yaroslavbiziuk@gmail.com -d cafehub.pp.ua --agree-tos
